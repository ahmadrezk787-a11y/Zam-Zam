<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عيادة زمزم - نظام الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .soft-card { background: #ffffff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="flex h-screen">

    <aside class="w-64 bg-slate-800 text-white p-6">
        <h1 class="text-2xl font-bold mb-10 text-teal-400"><i class="fa-solid fa-tooth ml-2"></i> عيادة زمزم</h1>
        <ul class="space-y-4">
            <li><button onclick="showTab('add-patient')" class="w-full text-right p-3 hover:bg-teal-700 rounded"><i class="fa-solid fa-user-plus ml-2"></i> إضافة مريض</button></li>
            <li><button onclick="showTab('patients-list')" class="w-full text-right p-3 hover:bg-teal-700 rounded"><i class="fa-solid fa-users ml-2"></i> سجل المرضى</button></li>
        </ul>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="add-patient" class="tab-content active-tab max-w-2xl mx-auto soft-card p-8">
            <h2 class="text-2xl font-bold mb-8">تسجيل مريض جديد</h2>
            <form id="patientForm" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="visitDate" class="w-full p-3 rounded-xl border">
                    <select id="visitType" class="w-full p-3 rounded-xl border"><option>جديد</option><option>متابعة</option></select>
                </div>
                <input type="text" id="patientName" placeholder="اسم المريض" class="w-full p-3 rounded-xl border">
                <select id="procedureType" class="w-full p-3 rounded-xl border">
                    <option>كشف</option><option>حشو عادي</option><option>حشو عصب</option><option>خلع عادي</option><option>خلع جراحي</option><option>خلع ضرس عقل</option>
                </select>
                <textarea id="notes" placeholder="ملاحظات..." class="w-full p-3 rounded-xl border h-24"></textarea>
                <button type="button" onclick="savePatient()" class="w-full bg-teal-600 text-white py-4 rounded-xl font-bold">حفظ بيانات المريض</button>
            </form>
        </div>

        <div id="patients-list" class="tab-content soft-card p-8">
            <input type="text" id="searchInput" onkeyup="searchPatient()" placeholder="بحث بالاسم..." class="w-full p-3 mb-6 rounded-xl border">
            <table class="w-full text-right">
                <thead><tr class="text-slate-500 border-b"><th class="py-3">التاريخ</th><th class="py-3">الاسم</th><th class="py-3">النوع</th><th class="py-3">الإجراء</th><th class="py-3">تحكم</th></tr></thead>
                <tbody id="patientsTableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        document.getElementById('visitDate').valueAsDate = new Date();

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active-tab');
        }

        function savePatient() {
            const name = document.getElementById('patientName').value;
            const date = document.getElementById('visitDate').value;
            const type = document.getElementById('visitType').value;
            const proc = document.getElementById('procedureType').value;
            
            const tbody = document.getElementById('patientsTableBody');
            tbody.innerHTML += `
                <tr class="border-b">
                    <td class="py-4">${date}</td>
                    <td class="py-4 text-blue-600 cursor-pointer">${name}</td>
                    <td class="py-4">${type}</td>
                    <td class="py-4">${proc}</td>
                    <td class="py-4">
                        <button class="text-blue-500 ml-3"><i class="fa-solid fa-pen"></i></button>
                        <button class="text-red-500" onclick="this.parentElement.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            alert("تم الحفظ!");
            document.getElementById('patientForm').reset();
        }

        function searchPatient() {
            let filter = document.getElementById('searchInput').value.toUpperCase();
            let tr = document.getElementById("patientsTableBody").getElementsByTagName("tr");
            for (let i = 0; i < tr.length; i++) {
                let txtValue = tr[i].getElementsByTagName("td")[1].textContent;
                tr[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    </script>
</body>
</html>
