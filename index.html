<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة عيادة الأسنان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; }
        .soft-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        select, input, textarea { background-color: #fcfcfc; border: 1px solid #e2e8f0; transition: 0.3s; }
        select:focus, input:focus { border-color: #94a3b8; outline: none; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-2xl mx-auto soft-card p-8">
        <h2 class="text-2xl font-bold text-slate-700 mb-8 flex items-center">
            <i class="fa-solid fa-user-plus ml-3 text-teal-600"></i> تسجيل مريض جديد
        </h2>

        <form class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">نوع الزيارة</label>
                    <select class="w-full p-3 rounded-xl border">
                        <option>مريض جديد</option>
                        <option>متابعة</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">تاريخ الزيارة</label>
                    <input type="date" id="visitDate" class="w-full p-3 rounded-xl border">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-2">اسم المريض</label>
                <input type="text" placeholder="اكتب اسم المريض هنا" class="w-full p-3 rounded-xl border">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-2">نوع الإجراء الطبي</label>
                <select class="w-full p-3 rounded-xl border">
                    <option disabled selected>اختر الإجراء...</option>
                    <option>كشف</option>
                    <option>تنظيف وتلميع أسنان</option>
                    <option>حشو عادي</option>
                    <option>حشو عصب</option>
                    <option>خلع عادي</option>
                    <option>خلع جراحي</option>
                    <option>خلع ضرس عقل</option>
                    <option>تركيبات / تيجان</option>
                    <option>تبييض أسنان</option>
                    <option>تقويم</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-2">ملاحظات إضافية</label>
                <textarea placeholder="أي ملاحظات خاصة..." class="w-full p-3 rounded-xl border h-24"></textarea>
            </div>

            <button type="button" class="w-full bg-teal-600 text-white py-4 rounded-xl font-bold hover:bg-teal-700 transition shadow-md">
                حفظ بيانات المريض
            </button>
        </form>
    </div>

    <script>
        // ضبط تاريخ اليوم تلقائياً
        document.getElementById('visitDate').valueAsDate = new Date();
    </script>
</body>
</html>
