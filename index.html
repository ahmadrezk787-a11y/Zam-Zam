<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عيادة زمزم - نظام الإدارة الشامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white p-6">
        <h1 class="text-2xl font-bold mb-10 text-teal-400"><i class="fa-solid fa-tooth ml-2"></i> عيادة زمزم</h1>
        <ul class="space-y-4">
            <li><button onclick="showTab('add-patient')" class="w-full text-right p-3 hover:bg-teal-700 rounded transition"><i class="fa-solid fa-user-plus ml-2"></i> إضافة مريض</button></li>
            <li><button onclick="showTab('patients-list')" class="w-full text-right p-3 hover:bg-teal-700 rounded transition"><i class="fa-solid fa-users ml-2"></i> سجل المرضى</button></li>
        </ul>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        
        <div id="add-patient" class="tab-content active-tab max-w-3xl mx-auto card p-8">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">تسجيل مريض جديد</h2>
            <form id="patientForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="date" id="visitDate" class="p-3 rounded-lg border">
                <select id="visitType" class="p-3 rounded-lg border"><option>جديد</option><option>متابعة</option></select>
                <input type="text" id="patientName" placeholder="اسم المريض" class="col-span-2 p-3 rounded-lg border">
                <select id="procedureType" class="col-span-2 p-3 rounded-lg border">
                    <option>كشف</option><option>حشو عادي</option><option>حشو عصب</option><option>خلع عادي</option><option>خلع جراحي</option><option>تركيبات</option>
                </select>
                <textarea id="notes" placeholder="ملاحظات طبية..." class="col-span-2 p-3 rounded-lg border h-24"></textarea>
                <button type="button" onclick="savePatient()" class="col-span-2 bg-teal-600 text-white p-4 rounded-lg font-bold">حفظ بيانات المريض</button>
            </form>
        </div>

        <div id="patients-list" class="tab-content card p-8">
            <input type="text" id="searchInput" onkeyup="searchPatient()" placeholder="🔍 ابحث عن مريض بالاسم..." class="w-full p-3 mb-6 rounded-lg border">
            <table class="w-full text-right border-collapse">
                <thead><tr class="border-b text-slate-500"><th class="p-3">التاريخ</th><th class="p-3">الاسم</th><th class="p-3">النوع</th><th class="p-3">الإجراء</th><th class="p-3">تحكم</th></tr></thead>
                <tbody id="patientsTableBody"></tbody>
            </table>
        </div>
    </main>

    <div id="patientModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl w-2/3 max-h-[80vh] overflow-y-auto">
            <h2 id="modalName" class="text-2xl font-bold mb-4"></h2>
            <label class="block mb-2">ملاحظات إضافية:</label>
            <textarea class="w-full p-3 border rounded-lg mb-4 h-32"></textarea>
            <label class="block mb-2">رفع صور أشعة:</label>
            <input type="file" class="mb-6">
            <div class="flex gap-4">
                <button onclick="document.getElementById('patientModal').classList.add('hidden')" class="bg-gray-500 text-white px-6 py-2 rounded-lg">إغلاق</button>
                <button class="bg-teal-600 text-white px-6 py-2 rounded-lg">حفظ التعديلات</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('visitDate').valueAsDate = new Date();

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active-tab');
        }

        function savePatient() {
            const name = document.getElementById('patientName').value;
            const date = document.getElementById('visitDate').value;
            const type = document.getElementById('visitType').value;
            const proc = document.getElementById('procedureType').value;
            const tbody = document.getElementById('patientsTableBody');
            
            tbody.innerHTML += `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-3">${date}</td>
                    <td class="p-3 text-blue-600 font-bold cursor-pointer" onclick="openModal('${name}')">${name}</td>
                    <td class="p-3">${type}</td>
                    <td class="p-3">${proc}</td>
                    <td class="p-3">
                        <button class="text-blue-500 ml-2"><i class="fa-solid fa-pen"></i></button>
                        <button class="text-red-500" onclick="this.parentElement.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            alert("تم حفظ المريض بنجاح!");
            document.getElementById('patientForm').reset();
        }

        function openModal(name) {
            document.getElementById('modalName').innerText = "ملف المريض: " + name;
            document.getElementById('patientModal').classList.remove('hidden');
        }

        function searchPatient() {
            let filter = document.getElementById('searchInput').value.toUpperCase();
            let rows = document.querySelectorAll("#patientsTableBody tr");
            rows.forEach(row => {
                let name = row.cells[1].textContent.toUpperCase();
                row.style.display = name.includes(filter) ? "" : "none";
            });
        }
    </script>
</body>
</html>
