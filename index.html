<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيادة زمزم — تسجيل مريض جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; }
        .card { background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4 md:p-10 flex justify-center">

    <div class="max-w-xl w-full card p-8">
        <h2 class="text-2xl font-bold text-slate-800 mb-8 flex items-center">
            <i class="fa-solid fa-user-plus ml-3 text-teal-600"></i> تسجيل مريض جديد
        </h2>

        <form class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">نوع الزيارة</label>
                    <select class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none">
                        <option>مريض جديد</option>
                        <option>متابعة</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">تاريخ الزيارة</label>
                    <input type="date" id="visitDate" class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-2">اسم المريض</label>
                <input type="text" placeholder="اكتب اسم المريض هنا" class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-2">نوع الإجراء الطبي</label>
                <select class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none">
                    <option disabled selected>اختر الإجراء...</option>
                    <option>كشف</option>
                    <option>تنظيف وتلميع أسنان</option>
                    <option>حشو عادي</option>
                    <option>حشو عصب</option>
                    <option>خلع عادي</option>
                    <option>خلع جراحي</option>
                    <option>خلع ضرس عقل</option>
                    <option>تركيبات / تيجان</option>
                    <option>تبييض أسنان</option>
                    <option>تقويم</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-2">ملاحظات إضافية</label>
                <textarea placeholder="اكتب أي ملاحظات طبية أو توصيات للمريض هنا..." class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none h-24"></textarea>
            </div>

            <button type="button" class="w-full bg-teal-600 text-white py-4 rounded-xl font-bold hover:bg-teal-700 transition duration-300 shadow-md">
                حفظ البيانات
            </button>
        </form>
    </div>

    <script>
        document.getElementById('visitDate').valueAsDate = new Date();
    </script>
</body>
</html>
