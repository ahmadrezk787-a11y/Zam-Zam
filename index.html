<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيادة زمزم — إدارة المرضى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="flex min-h-screen">

    <nav class="w-64 bg-slate-800 text-white p-6 shadow-xl">
        <h1 class="text-xl font-bold mb-10 text-blue-300 border-b border-slate-700 pb-4"><i class="fa-solid fa-clinic-medical"></i> عيادة زمزم</h1>
        <ul class="space-y-2">
            <li><button onclick="showTab('add-patient')" class="w-full text-right p-3 hover:bg-blue-600 rounded transition"><i class="fa-solid fa-user-plus ml-2"></i> إضافة مريض</button></li>
        </ul>
    </nav>

    <main class="flex-1 p-10">
        <div id="add-patient" class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center"><i class="fa-solid fa-user-plus ml-3 text-blue-600"></i> تسجيل مريض جديد</h2>
            
            <form class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" placeholder="اسم المريض" class="col-span-2 p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
                    <input type="number" placeholder="العمر" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
                    <input type="text" placeholder="رقم الهاتف" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
                </div>

                <div class="p-4 bg-slate-50 rounded-lg">
                    <label class="block text-sm font-semibold mb-2">نوع الزيارة:</label>
                    <div class="flex gap-4">
                        <label class="flex items-center"><input type="radio" name="visitType" value="new" class="ml-2"> مريض جديد</label>
                        <label class="flex items-center"><input type="radio" name="visitType" value="follow" class="ml-2"> متابعة</label>
                    </div>
                </div>

                <textarea placeholder="ملاحظات طبية..." class="w-full p-3 border rounded-lg h-24 focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
                
                <button type="button" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg">حفظ بيانات المريض</button>
            </form>
        </div>
    </main>

    <script>
        function showTab(tabId) {
            console.log("عرض تبويب: " + tabId);
        }
    </script>
</body>
</html>
