<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة عيادة زمزم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="h-screen flex">

    <nav class="w-64 bg-slate-900 text-white p-5">
        <h1 class="text-2xl font-bold mb-10 text-blue-400"><i class="fa-solid fa-stethoscope"></i> عيادة زمزم</h1>
        <ul class="space-y-4">
            <li><button onclick="showTab('dashboard')" class="w-full text-right p-3 hover:bg-slate-800 rounded"><i class="fa-solid fa-house"></i> الرئيسية</button></li>
            <li><button onclick="showTab('patients')" class="w-full text-right p-3 hover:bg-slate-800 rounded"><i class="fa-solid fa-user-injured"></i> المرضى</button></li>
            <li><button onclick="showTab('appointments')" class="w-full text-right p-3 hover:bg-slate-800 rounded"><i class="fa-solid fa-calendar-check"></i> المواعيد</button></li>
            <li><button onclick="showTab('finance')" class="w-full text-right p-3 hover:bg-slate-800 rounded"><i class="fa-solid fa-money-bill-wave"></i> الحسابات</button></li>
        </ul>
    </nav>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="dashboard" class="tab-content">
            <h2 class="text-2xl font-bold mb-6">لوحة التحكم</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-lg shadow">إجمالي المرضى: 0</div>
                <div class="bg-white p-6 rounded-lg shadow">مواعيد اليوم: 0</div>
                <div class="bg-white p-6 rounded-lg shadow">الدخل اليومي: 0</div>
            </div>
        </div>
        </main>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }
        showTab('dashboard');
    </script>
</body>
</html>
