<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيادة زمزم - نظام الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; }
        .tab-content { display: none; }
        .active-tab { display: block; }
    </style>
</head>
<body class="flex h-screen">

    <aside class="w-64 bg-slate-800 text-white p-6">
        <h1 class="text-2xl font-bold mb-10 text-teal-400"><i class="fa-solid fa-tooth"></i> عيادة زمزم</h1>
        <ul class="space-y-4">
            <li><button onclick="showTab('add-patient')" class="w-full text-right p-3 hover:bg-teal-700 rounded transition"><i class="fa-solid fa-user-plus ml-2"></i> إضافة مريض</button></li>
            <li><button onclick="showTab('patients-list')" class="w-full text-right p-3 hover:bg-teal-700 rounded transition"><i class="fa-solid fa-users ml-2"></i> سجل المرضى</button></li>
        </ul>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        
        <div id="add-patient" class="tab-content active-tab max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold text-slate-800 mb-8"><i class="fa-solid fa-user-plus ml-3 text-teal-600"></i> تسجيل مريض جديد</h2>
            <form class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <select class="w-full p-3 rounded-xl border border-slate-200"><option>مريض جديد</option><option>متابعة</option></select>
                    <input type="date" id="visitDate" class="w-full p-3 rounded-xl border border-slate-200">
                </div>
                <input type="text" placeholder="اسم المريض" class="w-full p-3 rounded-xl border border-slate-200">
                <select class="w-full p-3 rounded-xl border border-slate-200">
                    <option>كشف</option><option>حشو عادي</option><option>حشو عصب</option><option>خلع عادي</option>
                </select>
                <textarea placeholder="ملاحظات..." class="w-full p-3 rounded-xl border border-slate-200 h-24"></textarea>
                <button type="button" class="w-full bg-teal-600 text-white py-4 rounded-xl font-bold hover:bg-teal-700">حفظ البيانات</button>
            </form>
        </div>

        <div id="patients-list" class="tab-content bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-xl font-bold text-slate-800 mb-6">سجل ملفات المرضى</h2>
            <table class="w-full text-right border-collapse">
                <thead><tr class="border-b text-slate-500"><th class="py-3">الاسم</th><th class="py-3">الإجراء</th><th class="py-3">التاريخ</th></tr></thead>
                <tbody>
                    <tr class="border-b"><td class="py-4">أحمد محمد</td><td class="py-4">حشو عصب</td><td class="py-4">2026-05-25</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        document.getElementById('visitDate').valueAsDate = new Date();
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active-tab');
        }
    </script>
</body>
</html>
